<div class="container mt-4">
  <h3 class="text-center text-success mb-4">Partidos Registrados</h3>

  <!-- FORMULARIO -->
  <form [formGroup]="form" (ngSubmit)="registrarPartido()" class="card p-4 shadow mb-4">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label>Equipo Rival</label>
        <input type="text" class="form-control" formControlName="equipoRival">
      </div>
      <div class="col-md-6 mb-3">
        <label>Fecha</label>
        <input type="date" class="form-control" formControlName="fecha">
      </div>
      <div class="col-md-6 mb-3">
        <label>Estadio</label>
        <input type="text" class="form-control" formControlName="estadio">
      </div>
      <div class="col-md-6 mb-3">
        <label>Lugar</label>
        <input type="text" class="form-control" formControlName="lugar">
      </div>
      <div class="col-md-6 mb-3">
        <label>Competencia</label>
        <input type="text" class="form-control" formControlName="competencia">
      </div>
      <div class="col-md-6 mb-3">
        <label>Técnico</label>
        <select class="form-control" formControlName="tecnico">
          <option value="">Seleccione Técnico</option>
          <option *ngFor="let tecnico of tecnicosDisponibles" [value]="tecnico._id">
            {{ tecnico.nombre }}
          </option>
        </select>
      </div>
    </div>

    <!-- Jugadores Convocados -->
    <div class="mb-3">
      <h5>Jugadores Convocados</h5>

      <div class="row align-items-center mb-2">
        <div class="col-md-10">
          <select class="form-control" [(ngModel)]="jugadorSeleccionado" [ngModelOptions]="{standalone: true}">
            <option [ngValue]="null">Seleccione Jugador</option>
            <option *ngFor="let jugador of jugadoresDisponibles" [ngValue]="jugador">
              {{ jugador.nombre }}
            </option>
          </select>
        </div>
        <div class="col-md-2 text-center">
          <button type="button" class="btn btn-success" (click)="agregarJugador()">Agregar</button>
        </div>
      </div>

      <div *ngIf="jugadoresConvocados.length > 0" class="mt-3">
        <ul class="list-group">
          <li *ngFor="let jugador of jugadoresConvocados; let i = index" class="list-group-item d-flex justify-content-between align-items-center">
            {{ jugador.nombre }} - {{ jugador.posicion }}
            <button type="button" class="btn btn-danger btn-sm" (click)="eliminarJugador(i)">Quitar</button>
          </li>
        </ul>
      </div>
    </div>

    <!-- BOTÓN GUARDAR -->
    <div class="mt-4">
      <button class="btn btn-success w-100" type="submit" [disabled]="form.invalid">
        {{ editando ? 'Actualizar Partido' : 'Crear Partido' }}
      </button>
    </div>
  </form>

  <!-- LISTA DE PARTIDOS -->
  <div *ngIf="partidos.length === 0" class="text-center text-muted">No hay partidos registrados.</div>

  <div *ngIf="partidos.length > 0" class="table-responsive">
    <table class="table table-hover table-bordered shadow">
      <thead class="table-dark">
        <tr>
          <th>Rival</th>
          <th>Fecha</th>
          <th>Estadio</th>
          <th>Competencia</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let partido of partidos">
          <td>{{ partido.equipoRival }}</td>
          <td>{{ partido.fecha | date: 'mediumDate' }}</td>
          <td>{{ partido.estadio }}</td>
          <td>{{ partido.competencia }}</td>
          <td class="text-center">
            <button class="btn btn-warning btn-sm me-2" (click)="editarPartido(partido)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="eliminarPartido(partido._id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
