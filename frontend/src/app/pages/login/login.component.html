<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">
  <div class="card shadow-lg p-4 mx-auto" style="width: 400px;">
    <div class="container mb-4" style="max-width: 400px;">
      <div *ngIf="mensaje" class="alert alert-success mt-3">
        {{ mensaje }}
      </div>

      <div *ngIf="error" class="alert alert-danger mt-3">
        {{ error }}
      </div>


      <form [formGroup]="form" (ngSubmit)="login()" class="container mt-2" style="max-width: 400px">
        <h2 class="text-center">Login</h2>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" formControlName="correo" />
        </div>

        <div class="mb-3">
          <label>Contraseña</label>
          <input type="password" class="form-control" formControlName="contrasena" />
        </div>

        <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>

        <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>

        <div class="text-center mt-3">
          <p>¿No tienes cuenta?</p>
          <a routerLink="/registro" class="btn btn-danger w-100">Registrarse aqui</a>
        </div>

      </form>
    </div>
  </div>
</div>
